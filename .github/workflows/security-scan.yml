name: security-scan

# Security scan gates for VPC: trivy + gosec + govulncheck.

on:
  push:
    branches: [main, KAC-*]
  pull_request:

permissions:
  contents: read
  security-events: write
  pull-requests: write

defaults:
  run:
    working-directory: kacho-vpc

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-vpc }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-corelib, ref: vpc8-fixes, path: kacho-corelib }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-proto, ref: main, path: kacho-proto }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-geo, ref: main, path: kacho-geo }
      - uses: actions/setup-go@v6
        with: { go-version-file: kacho-vpc/go.mod }
      - name: gosec scan (SARIF)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          # gosec возвращает non-zero при любой находке; SARIF нужен для
          # code-scanning, поэтому саму генерацию не валим — блокирует отдельный
          # severity-gate ниже (уже после upload).
          "$(go env GOPATH)/bin/gosec" -fmt sarif -out gosec.sarif ./... || true
          # gosec дублирует записи в properties.tags, что отвергает codeql-валидатор
          # SARIF («contains duplicate item»). Дедупим теги каждого правила либо
          # подставляем пустой схема-валидный документ.
          if jq -e . gosec.sarif >/dev/null 2>&1; then
            jq '(.runs[].tool.driver.rules[]?.properties.tags) |= (if . then unique else . end)' \
              gosec.sarif > gosec.sanitized.sarif && mv gosec.sanitized.sarif gosec.sarif
          else
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"gosec","rules":[]}},"results":[]}]}' > gosec.sarif
          fi
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: kacho-vpc/gosec.sarif, category: gosec }
      - name: gate — fail on HIGH-severity gosec findings
        run: |
          # gosec мапит severity HIGH → SARIF level "error". Блокируем job при
          # любой HIGH-находке; MEDIUM/LOW остаются информативными в code-scanning.
          n=$(jq '[.runs[].results[]? | select(.level=="error")] | length' gosec.sarif)
          echo "gosec HIGH (error-level) findings: $n"
          test "$n" -eq 0

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-vpc }
      - uses: aquasecurity/trivy-action@v0.33.0  # pin на конкретный release-тег (mutable @master запрещён); aquasec публикует v-префиксные теги
        with:
          scan-type: 'fs'
          scan-ref: 'kacho-vpc'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { path: kacho-vpc }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-corelib, ref: vpc8-fixes, path: kacho-corelib }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-proto, ref: main, path: kacho-proto }
      - uses: actions/checkout@v6
        with: { repository: PRO-Robotech/kacho-geo, ref: main, path: kacho-geo }
      - uses: actions/setup-go@v6
        with: { go-version-file: kacho-vpc/go.mod }
      - name: govulncheck scan (SARIF)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          # SARIF для code-scanning; генерацию не валим, чтобы upload прошёл —
          # блокирует отдельный нативный gate ниже (exit-код govulncheck).
          "$(go env GOPATH)/bin/govulncheck" -mode=source -format=sarif ./... > govulncheck.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: kacho-vpc/govulncheck.sarif, category: govulncheck }
      - name: gate — fail on known vulnerabilities
        # govulncheck возвращает non-zero при найденных уязвимостях в reachable-коде.
        run: "$(go env GOPATH)/bin/govulncheck -mode=source ./..."
